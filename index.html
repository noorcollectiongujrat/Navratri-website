<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Noor Collection - 35 Designs Rs 800</title>
<style>
body{margin:0;font-family:system-ui;background:#fff7ed}
header{background:#9f1239;color:#fff;padding:18px;text-align:center;position:sticky;top:0;z-index:9}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}
.card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 4px 10px rgba(0,0,0,.1);text-align:center;padding-bottom:10px}
.card img{width:100%;height:320px;object-fit:cover;background:#eee}
.price{color:#be123c;font-weight:800;font-size:18px;margin:4px}
.btn{background:#25D366;color:#fff;padding:8px 14px;border-radius:20px;text-decoration:none;display:inline-block;font-weight:700;margin-top:4px;font-size:14px}
</style>
</head>
<body>
<header><h1 style="margin:0;font-size:20px">Noor Collection Gujarat</h1><p style="margin:4px 0 0">35 Navratri Designs - Rs 800 Only</p></header>
<div class="grid" id="grid">Loading designs...</div>
<script>
const WA="919876543210";
async function load(){
const res=await fetch("https://api.github.com/repos/noorcollectiongujrat/Navratri-website/contents/");
const files=await res.json();
const imgs=files.filter(f=>f.name.match(/\.jpe?g|\.png$/i));
let html="";
imgs.forEach((f,i)=>{
html+=`<div class="card"><img src="${f.download_url}" loading="lazy"><div style="font-size:13px;margin-top:6px">Design ${i+1}</div><div class="price">Rs 800</div><a class="btn" href="https://wa.me/${WA}?text=Hi, Mujhe Design ${i+1} (${f.name}) chahiye Rs 800 me" target="_blank">Order on WhatsApp</a></div>`;
});
document.getElementById("grid").innerHTML=html||"No photos found. Upload jpg files.";
}
load();
</script>
</body>
</html>
